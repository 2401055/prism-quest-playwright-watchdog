name: Prism Quest Playwright watchdog

on:
  workflow_dispatch:
    inputs:
      start_delay_ms:
        description: 'Delay browser start for a warm handoff'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 359
    env:
      WHIP_URL: https://prism-quest-watchdog-cron.2401055.workers.dev/whip
      BROADCAST_URL: https://prism-quest-broadcast.pages.dev/broadcast
      HEADLESS: '1'
      MAX_RUNTIME_MS: '17990000'
      RESTART_MS: '10000'
      START_DELAY_MS: ${{ inputs.start_delay_ms || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Validate WHIP endpoint
        run: |
          code=$(curl -sS -o /tmp/whip-check.txt -w '%{http_code}' -X POST -H 'Content-Type: application/sdp' --data-binary '' "$WHIP_URL")
          echo "WHIP endpoint HTTP status: $code"
          test "$code" = "400"
      - name: Start and monitor broadcast
        run: node bot.mjs
